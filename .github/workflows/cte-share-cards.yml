name: CTE share cards (auto)
# Builds Facebook/iMessage previews (share/<id>.html + card) for new articles
# whenever newsroom files change on main, and commits only the share/ folder.
on:
  push:
    branches: [main]
    paths: ['news*.js', 'news.html', 'tools/share/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cte-share-cards
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow==11.0.0 && sudo apt-get install -y fonts-inter >/dev/null 2>&1 || true
      - run: python tools/share/build-share-cards.py
      - name: Commit new share pages
        run: |
          git add share
          if git diff --cached --quiet; then echo "Share previews already current"; exit 0; fi
          git config user.name "cte-share-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "share: build link previews for new articles"
          git push
