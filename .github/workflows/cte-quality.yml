name: CTE Quality Guardrails
on:
  pull_request:
    paths:
      - 'app-v29.js'
      - 'css/cte-quality.css'
      - 'index.html'
      - 'history-lab.html'
      - 'playoff-war-room.html'
      - 'news.html'
      - 'tests/components/quality.test.cjs'
      - '.github/workflows/cte-quality.yml'
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app-v29.js
      - run: node tests/components/quality.test.cjs
      - run: node tests/components/navigation.test.cjs
