name: Commissioner Claim Provisioning Tests
on:
  pull_request:
    paths:
      - 'tools/assign-commissioner-claims.py'
      - 'tools/test-commissioner-claims.py'
      - 'docs/cte-network-2/COMMISSIONER_SETUP.md'
      - '.github/workflows/commissioner-claims-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test-commissioner-claims.py' -v
      - run: python -m py_compile tools/assign-commissioner-claims.py
