name: Firebase Legacy Rules Preservation Checks
on:
  pull_request:
    paths:
      - 'tools/stage-v2-firebase-rules.py'
      - 'tools/test-stage-v2-firebase-rules.py'
      - '.github/workflows/cte-rules-stage-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/test-stage-v2-firebase-rules.py -v
      - run: python -m py_compile tools/stage-v2-firebase-rules.py
