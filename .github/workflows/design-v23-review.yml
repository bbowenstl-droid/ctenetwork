name: CTE design review
on:
  push:
    branches: [design/cte-network-2-0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply shared design to public pages
        run: python tools/apply-design-v23.py
      - name: Verify design references and internal page links
        run: |
          python tools/apply-design-v23.py --check
          python - <<'PY'
          from pathlib import Path
          import re
          excluded={'admin.html','sleeper-check.html'}
          pages=[p for p in Path('.').glob('*.html') if p.name not in excluded]
          assert pages
          for page in pages:
              text=page.read_text()
              assert 'design-v23.css?v=23' in text, page
              assert 'design-v23.js?v=23' in text, page
              for link in re.findall(r'href=["\']([^"\']+\.html)(?:\?[^"\']*)?["\']', text):
                  assert Path(link).exists(), (page, link)
          print(f'PASS: {len(pages)} public HTML pages include v23 assets and linked HTML files exist')
          PY
      - name: Commit integrated pages to design branch
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.html'
            git commit -m 'Apply v23 design to all public pages [skip ci]'
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser smoke tests and screenshots
        run: |
          python -m http.server 8765 >/tmp/cte-server.log 2>&1 &
          node tools/design-smoke-v23.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cte-design-review-screenshots
          path: design-review-screenshots/
          if-no-files-found: ignore
