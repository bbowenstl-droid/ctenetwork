<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule • CTE Network</title><link rel="stylesheet" href="league-v15.css?v=15"><script src="data/league-data.js?v=15"></script><script src="sleeper-api-v16.js?v=16"></script><script src="js/league-engine.js?v=15"></script><script src="cte-network-core-v15.js?v=15"></script></head><body><div class="league-shell"><header class="league-header"><img src="cte-league-logo.png" alt="CTE League logo"><div><div class="league-kicker">OFFICIAL HOME OF THE CTE LEAGUE</div><h1 class="league-title">CTE NETWORK</h1><div class="muted">Year 2 • Established 2025</div></div></header></div><nav class="league-nav"><div class="league-nav-inner"><a href="index.html" class="">Home</a><a href="news.html" class="">News</a><a href="scores.html" class="">Scores</a><a href="schedule.html" class="active">Schedule</a><a href="standings.html" class="">Standings</a><a href="teams.html" class="">Teams</a><a href="transactions.html" class="">Transactions</a><a href="records.html" class="">Records</a><a href="league-history.html" class="">History</a><a href="draft-central.html" class="">Draft Central</a></div></nav><main class="league-shell"><noscript class="notice error">JavaScript is required for live Sleeper data. The CTE Network navigation will still work.</noscript>
<div class="section-head"><div><div class="eyebrow">MATCHUP CENTER</div><h2>League Schedule</h2></div><div class="schedule-toolbar"><select id="season" class="schedule-select"></select><select id="week" class="schedule-select"></select><span id="liveStamp" class="live-stamp">Updating…</span><button id="refreshLive" class="refresh-btn">↻ Refresh</button></div></div>
<div id="featured"></div><div id="summary" class="week-summary"></div><div id="schedule" class="league-card loading">Loading schedule…</div>
<script>
let snapshot=null,lookup=null;
function recordFor(roster){const s=roster?.settings||{};return `${Number(s.wins||0)}-${Number(s.losses||0)}${Number(s.ties||0)?'-'+Number(s.ties):''}`}
function gameStatus(a,b,season,week,league){const sa=Number(a.points||0),sb=Number(b.points||0),current=Number(league?.settings?.leg||0);if(Number(season)<Number(CTE_LEAGUE_DATA.league.currentSeason)||Number(week)<current||sa>0||sb>0)return 'final';if(Number(week)===current&&current>0)return 'live';return 'upcoming'}
function chooseFeatured(games,season,week,league,rosters){if(!games.length)return null;const completed=games.filter(g=>Number(g.a.points||0)>0||Number(g.b.points||0)>0);if(completed.length)return completed.slice().sort((x,y)=>Math.abs(Number(x.a.points||0)-Number(x.b.points||0))-Math.abs(Number(y.a.points||0)-Number(y.b.points||0)))[0];const rb=Object.fromEntries((rosters||[]).map(r=>[String(r.roster_id),r]));return games.slice().sort((x,y)=>{const xp=Number(rb[String(x.a.roster_id)]?.settings?.fpts||0),yp=Number(rb[String(y.a.roster_id)]?.settings?.fpts||0);const x2=Number(rb[String(x.b.roster_id)]?.settings?.fpts||0),y2=Number(rb[String(y.b.roster_id)]?.settings?.fpts||0);return (yp+y2)-(xp+x2)})[0]}
async function render(options={}){const season=Number(document.getElementById('season').value),week=Number(document.getElementById('week').value),cfg=CTE_LEAGUE_DATA.league.seasons[season],box=document.getElementById('schedule'),btn=document.getElementById('refreshLive');btn.disabled=true;box.className='league-card loading';box.textContent=`Loading ${season} Week ${week}…`;try{snapshot=await CTE_Sleeper.getLeagueSnapshot(cfg.sleeperLeagueId,options);lookup=CTE_UI.mapForSeason(season,snapshot.users,snapshot.rosters);const rows=await CTE_Sleeper.getMatchups(cfg.sleeperLeagueId,week,options);const groups=CTE_LeagueEngine.groupMatchups(rows).filter(p=>p.length===2).map(p=>({a:p[0],b:p[1]}));const featured=chooseFeatured(groups,season,week,snapshot.league,snapshot.rosters);const rosterBy=Object.fromEntries(snapshot.rosters.map(r=>[String(r.roster_id),r]));let finals=0,totalPts=0,closest=null;groups.forEach(g=>{const st=gameStatus(g.a,g.b,season,week,snapshot.league);if(st==='final'){finals++;totalPts+=Number(g.a.points||0)+Number(g.b.points||0);const m=Math.abs(Number(g.a.points||0)-Number(g.b.points||0));closest=closest==null?m:Math.min(closest,m)}});document.getElementById('summary').innerHTML=`<div class="profile-stat"><span>Week</span><strong>${week}</strong></div><div class="profile-stat"><span>Matchups</span><strong>${groups.length}</strong></div><div class="profile-stat"><span>Finals</span><strong>${finals}</strong></div><div class="profile-stat"><span>Points Scored</span><strong>${totalPts?totalPts.toFixed(2):'—'}</strong></div>`;
if(featured){const am=lookup[String(featured.a.roster_id)],bm=lookup[String(featured.b.roster_id)],ao=CTE_UI.owner(CTE_LeagueEngine.ownerForHistoricalWeek(am?.ownerId,season,week)),bo=CTE_UI.owner(CTE_LeagueEngine.ownerForHistoricalWeek(bm?.ownerId,season,week));document.getElementById('featured').innerHTML=`<div class="gotw"><div class="eyebrow">⭐ GAME OF THE WEEK</div><div class="gotw-title">${CTE_UI.ownerLink(ao.id,ao.name)} vs ${CTE_UI.ownerLink(bo.id,bo.name)}</div><div class="gotw-sub">${CTE_UI.esc(am?.sleeperTeamName||ao.currentTeamName||'')} vs ${CTE_UI.esc(bm?.sleeperTeamName||bo.currentTeamName||'')} • Click the matchup below for the full matchup center.</div></div>`}else document.getElementById('featured').innerHTML='';
box.className='league-card';if(!groups.length){box.innerHTML='<div class="empty-schedule">No matchup data posted for this week yet.</div>';CTE_UI.setLiveStamp();return}box.innerHTML=`<div class="schedule-grid">${groups.map(g=>{const am=lookup[String(g.a.roster_id)],bm=lookup[String(g.b.roster_id)],aid=CTE_LeagueEngine.ownerForHistoricalWeek(am?.ownerId,season,week),bid=CTE_LeagueEngine.ownerForHistoricalWeek(bm?.ownerId,season,week),ao=CTE_UI.owner(aid),bo=CTE_UI.owner(bid),st=gameStatus(g.a,g.b,season,week,snapshot.league),isF=featured&&String(featured.a.matchup_id)===String(g.a.matchup_id),href=`matchup.html?season=${season}&week=${week}&matchup=${encodeURIComponent(g.a.matchup_id)}`;return `<a class="schedule-card ${isF?'featured':''}" href="${href}">${isF?'<div class="schedule-featured-tag">Featured</div>':''}<div class="schedule-card-head"><span>Matchup ${CTE_UI.esc(g.a.matchup_id)}</span><span class="schedule-status ${st}">${st==='final'?'Final':st==='live'?'Current Week':'Upcoming'}</span></div><div class="schedule-team-row"><div><div class="schedule-owner">${CTE_UI.esc(ao.name)}</div><div class="schedule-team-name">${CTE_UI.esc(am?.sleeperTeamName||ao.currentTeamName||'')}</div><div class="schedule-record">${recordFor(rosterBy[String(g.a.roster_id)])}</div></div><div class="schedule-score">${st==='upcoming'?'—':CTE_UI.fmt(g.a.points)}</div></div><div class="schedule-team-row"><div><div class="schedule-owner">${CTE_UI.esc(bo.name)}</div><div class="schedule-team-name">${CTE_UI.esc(bm?.sleeperTeamName||bo.currentTeamName||'')}</div><div class="schedule-record">${recordFor(rosterBy[String(g.b.roster_id)])}</div></div><div class="schedule-score">${st==='upcoming'?'—':CTE_UI.fmt(g.b.points)}</div></div></a>`}).join('')}</div>`;CTE_UI.setLiveStamp()}catch(e){box.className='league-card';box.innerHTML=`<div class="notice error">${CTE_UI.esc(e.message)}</div>`}finally{btn.disabled=false}}
(async()=>{const seasonSel=document.getElementById('season'),weekSel=document.getElementById('week');Object.keys(CTE_LEAGUE_DATA.league.seasons).sort().forEach(y=>seasonSel.add(new Option(`${y} • Year ${CTE_LEAGUE_DATA.league.seasons[y].yearNumber}`,y)));seasonSel.value=CTE_LEAGUE_DATA.league.currentSeason;for(let w=1;w<=18;w++)weekSel.add(new Option('Week '+w,w));try{const cfg=CTE_LEAGUE_DATA.league.seasons[CTE_LEAGUE_DATA.league.currentSeason],lg=await CTE_Sleeper.getLeague(cfg.sleeperLeagueId,{fresh:true});weekSel.value=Math.max(1,Number(lg.settings?.leg||1))}catch(_){weekSel.value=1}seasonSel.onchange=async()=>{if(Number(seasonSel.value)!==CTE_LEAGUE_DATA.league.currentSeason)weekSel.value=1;else try{const cfg=CTE_LEAGUE_DATA.league.seasons[Number(seasonSel.value)],lg=await CTE_Sleeper.getLeague(cfg.sleeperLeagueId,{fresh:true});weekSel.value=Math.max(1,Number(lg.settings?.leg||1))}catch(_){}render({fresh:true})};weekSel.onchange=()=>render();document.getElementById('refreshLive').onclick=()=>{CTE_Sleeper.clearCache();render({fresh:true})};render({fresh:true})})();
</script></main><footer class="footer">CTE Network • Official Home of the CTE League • Powered by Sleeper</footer></body></html>
