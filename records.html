<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Records • CTE League HQ</title><link rel="stylesheet" href="league.css"><script src="data/league-data.js?v=6"></script><script src="js/sleeper-api.js?v=6"></script><script src="js/league-engine.js?v=6"></script><script src="js/stats-engine.js?v=6"></script><script src="js/league-ui.js?v=6"></script></head><body><script>CTE_UI.shellStart('records')</script>
<div class="section-head"><div><div class="eyebrow">All-Time</div><h2>CTE Record Book</h2></div><div><span id="status" class="status-pill">Building history…</span><div style="margin-top:7px"><div class="live-controls"><span id="liveStamp" class="live-stamp">Updating…</span><button id="refreshLive" class="refresh-btn" type="button" title="Pull fresh data from Sleeper">↻ Refresh</button></div></div></div></div>
<div id="recordCards" class="record-grid"><div class="record-box loading">Loading 2025...</div></div>
<div class="section-head"><h2>Owner Career Records</h2></div><div id="career" class="league-card loading">Pulling every completed CTE matchup from Sleeper…</div>
<div class="section-head"><h2>Head-to-Head</h2></div><div id="h2h" class="league-card loading">Calculating rivalries…</div>
<script>
async function loadRecords(options={}){
 const status=document.getElementById('status'),cards=document.getElementById('recordCards'),career=document.getElementById('career'),h2h=document.getElementById('h2h');
 const name=id=>CTE_UI.owner(id).name;
 try{
  const archives=await CTE_StatsEngine.loadAllSeasons(options);
  const result=CTE_StatsEngine.calculateOwnerStats(archives), rec=CTE_StatsEngine.calculateLeagueRecords(result);
  const gameLabel=g=>g?`${name(g.ownerA)} ${CTE_UI.fmt(g.scoreA)} – ${CTE_UI.fmt(g.scoreB)} ${name(g.ownerB)}<div class="team">${g.season} • Week ${g.week}</div>`:'—';
  const sideLabel=r=>r?`${name(r.ownerId)} • ${CTE_UI.fmt(r.score)}<div class="team">${r.season} • Week ${r.week}</div>`:'—';
  cards.innerHTML=`
   <div class="record-box"><span class="muted">Highest Score</span><strong>${rec.highScore?CTE_UI.fmt(rec.highScore.score):'—'}</strong><div>${rec.highScore?name(rec.highScore.ownerId):'—'}</div><div class="team">${rec.highScore?`${rec.highScore.season} • Week ${rec.highScore.week}`:''}</div></div>
   <div class="record-box"><span class="muted">Biggest Blowout</span><strong>${rec.biggestBlowout?CTE_UI.fmt(rec.biggestBlowout.margin):'—'}</strong><div>${gameLabel(rec.biggestBlowout)}</div></div>
   <div class="record-box"><span class="muted">Closest Game</span><strong>${rec.closestGame?CTE_UI.fmt(rec.closestGame.margin):'—'}</strong><div>${gameLabel(rec.closestGame)}</div></div>
   <div class="record-box"><span class="muted">Longest Win Streak</span><strong>${rec.longestWin?rec.longestWin.longestWinStreak:'—'}</strong><div>${rec.longestWin?name(rec.longestWin.ownerId):'—'}</div></div>
   <div class="record-box"><span class="muted">All-Time Points Leader</span><strong>${rec.mostPoints?CTE_UI.fmt(rec.mostPoints.pointsFor):'—'}</strong><div>${rec.mostPoints?name(rec.mostPoints.ownerId):'—'}</div></div>
   <div class="record-box"><span class="muted">Best Win %</span><strong>${rec.bestPct?(rec.bestPct.winPct*100).toFixed(1)+'%':'—'}</strong><div>${rec.bestPct?name(rec.bestPct.ownerId):'—'}</div></div>
   <div class="record-box"><span class="muted">Championships</span><strong>1</strong><div>Brendan</div></div>
   <div class="record-box"><span class="muted">First Champion</span><strong>2025</strong><div>Brendan</div></div>`;
  const rows=Object.values(result.owners).filter(s=>s.games>0).sort((a,b)=>b.championships-a.championships||b.winPct-a.winPct||b.wins-a.wins);
  career.classList.remove('loading');career.innerHTML=`<div class="table-wrap"><table class="league-table"><thead><tr><th>Owner</th><th>W</th><th>L</th><th>Win %</th><th>PF</th><th>Avg</th><th>Playoffs</th><th>Titles</th></tr></thead><tbody>${rows.map(s=>`<tr><td class="owner">${CTE_UI.esc(name(s.ownerId))}</td><td>${s.wins}</td><td>${s.losses}</td><td>${(s.winPct*100).toFixed(1)}%</td><td>${CTE_UI.fmt(s.pointsFor)}</td><td>${CTE_UI.fmt(s.avgScore)}</td><td>${s.playoffWins}-${s.playoffLosses}</td><td>${s.championships}</td></tr>`).join('')}</tbody></table></div>`;
  const h=CTE_StatsEngine.headToHead(result.games), active=Object.values(CTE_LEAGUE_DATA.owners).filter(o=>o.status==='active');
  h2h.classList.remove('loading');h2h.innerHTML=active.map(o=>{const opponents=active.filter(x=>x.id!==o.id).map(x=>h[`${o.id}|${x.id}`]).filter(Boolean).sort((a,b)=>b.games-a.games||b.wins-a.wins);if(!opponents.length)return'';return `<div style="margin-bottom:22px"><div class="division-title">${CTE_UI.esc(o.name)}</div><div class="table-wrap"><table class="league-table"><thead><tr><th>Opponent</th><th>W</th><th>L</th><th>PF</th><th>PA</th></tr></thead><tbody>${opponents.map(r=>`<tr><td>${CTE_UI.esc(name(r.opponentId))}</td><td>${r.wins}</td><td>${r.losses}</td><td>${CTE_UI.fmt(r.pf)}</td><td>${CTE_UI.fmt(r.pa)}</td></tr>`).join('')}</tbody></table></div></div>`}).join('');
  status.textContent=`Live history • ${result.games.length} completed games`;status.classList.add('live');CTE_UI.setLiveStamp();
 }catch(e){cards.innerHTML=`<div class="notice error">${CTE_UI.esc(e.message)}</div>`;career.classList.remove('loading');career.innerHTML='<div class="notice error">Historical stats could not load.</div>';h2h.classList.remove('loading');h2h.innerHTML='';status.textContent='History load failed';}finally{const b=document.getElementById('refreshLive');if(b)b.disabled=false}
}
document.getElementById('refreshLive').onclick=()=>{document.getElementById('refreshLive').disabled=true;CTE_Sleeper.clearCache();loadRecords({fresh:true})};document.getElementById('refreshLive').disabled=true;loadRecords({fresh:true});
</script><script>CTE_UI.shellEnd()</script></body></html>
