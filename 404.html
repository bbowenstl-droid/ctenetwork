<base href="/ctenetwork/">

<title>Page not found • CTE Network</title>

<style>

  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0c0f;color:#f6f3ec;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
  main{width:100%;max-width:440px}
  img{display:block;width:96px;height:96px;border-radius:20px;margin-bottom:22px}

  h1{font-size:clamp(36px,10vw,52px);line-height:1.02;letter-spacing:-.04em;margin:14px 0 10px}
  p{color:#b2b6be;margin:0 0 22px}
  form{display:flex;gap:8px;margin-bottom:22px}
  label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid #3a3d44;background:#16181d;color:#fff;font:inherit;padding:0 14px}
  input:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #d7a83d;outline-offset:2px}
  button{min-height:48px;border:0;border-radius:12px;background:#d7a83d;color:#0b0c0f;font:700 15px/1 inherit;padding:0 18px;cursor:pointer}
  nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  nav a{display:flex;align-items:center;min-height:48px;padding:0 14px;border-radius:12px;background:#16181d;color:#f6f3ec;text-decoration:none;font-weight:600}
  nav a:hover{background:#1f2228}
</style>
</head>

  <form action="search.html" method="get" role="search">

    <input id="q" name="q" type="search" placeholder="Owner, player, team or story" autocomplete="off">

  <nav aria-label="CTE Network">
