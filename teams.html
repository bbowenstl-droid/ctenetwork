<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teams • CTE League HQ</title><link rel="stylesheet" href="league.css"><script src="data/league-data.js?v=5"></script><script src="js/league-ui.js?v=5"></script></head><body><script>CTE_UI.shellStart('teams')</script><div class="section-head"><div><div class="eyebrow">Current Owners</div><h2>The 12</h2></div></div><div id="teams" class="three-col"></div><script>const order=['north','south','central','littleBabies'];document.getElementById('teams').innerHTML=order.flatMap(d=>Object.values(CTE_LEAGUE_DATA.owners).filter(o=>o.status==='active'&&o.currentDivisionId===d).map(o=>`<article class="league-card"><div class="eyebrow">${CTE_UI.divisionName(d)}</div><h2 style="margin:8px 0 4px">${CTE_UI.esc(o.name)}</h2><div class="gold" style="font-weight:900">${CTE_UI.esc(o.currentTeamName)}</div><div class="muted" style="margin-top:12px">CTE owner since ${o.joined.season}${o.joined.week>1?' • Week '+o.joined.week:''}</div></article>`)).join('');</script><script>CTE_UI.shellEnd()</script></body></html>
