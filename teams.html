<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teams • CTE League HQ</title><link rel="stylesheet" href="league.css"><script src="data/league-data.js?v=6"></script><script src="js/sleeper-api.js?v=6"></script><script src="js/league-engine.js?v=6"></script><script src="js/league-ui.js?v=6"></script></head><body><script>CTE_UI.shellStart('teams')</script>
<div class="section-head"><div><div class="eyebrow">Current Owners</div><h2>The 12</h2></div><div class="live-controls"><span id="liveStamp" class="live-stamp">Updating…</span><button id="refreshLive" class="refresh-btn" type="button" title="Pull fresh data from Sleeper">↻ Refresh</button></div></div><div id="teams" class="three-col"><div class="league-card loading">Loading current Sleeper teams…</div></div>
<script>
async function loadTeams(options={}){const box=document.getElementById('teams'),btn=document.getElementById('refreshLive');btn.disabled=true;try{const cfg=CTE_LEAGUE_DATA.league.seasons[2026],snap=await CTE_Sleeper.getLeagueSnapshot(cfg.sleeperLeagueId,options),lookup=CTE_UI.mapForSeason(2026,snap.users,snap.rosters),byOwner={};Object.values(lookup).forEach(m=>{if(m.ownerId)byOwner[m.ownerId]=m});const order=['north','south','central','littleBabies'];box.innerHTML=order.flatMap(d=>Object.values(CTE_LEAGUE_DATA.owners).filter(o=>o.status==='active'&&o.currentDivisionId===d).map(o=>{const live=byOwner[o.id];return `<article class="league-card"><div class="eyebrow">${CTE_UI.divisionName(d)}</div><h2 style="margin:8px 0 4px">${CTE_UI.esc(o.name)}</h2><div class="gold" style="font-weight:900">${CTE_UI.esc(live?.sleeperTeamName||o.currentTeamName)}</div><div class="muted" style="margin-top:12px">CTE owner since ${o.joined.season}${o.joined.week>1?' • Week '+o.joined.week:''}</div></article>`})).join('');CTE_UI.setLiveStamp()}catch(e){box.innerHTML=`<div class="league-card notice error">${CTE_UI.esc(e.message)}</div>`}finally{btn.disabled=false}}
document.getElementById('refreshLive').onclick=()=>{CTE_Sleeper.clearCache();loadTeams({fresh:true})};loadTeams({fresh:true});
</script><script>CTE_UI.shellEnd()</script></body></html>
