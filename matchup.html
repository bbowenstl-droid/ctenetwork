<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matchup Center • CTE Network</title><link rel="stylesheet" href="league-v15.css?v=15"><script src="data/league-data.js?v=15"></script><script src="js/sleeper-api.js?v=15"></script><script src="js/league-engine.js?v=15"></script><script src="js/cte-network-core-v15.js?v=15"></script></head><body><div class="league-shell"><header class="league-header"><img src="cte-league-logo.png" alt="CTE League logo"><div><div class="league-kicker">OFFICIAL HOME OF THE CTE LEAGUE</div><h1 class="league-title">CTE NETWORK</h1><div class="muted">Year 2 • Established 2025</div></div></header></div><nav class="league-nav"><div class="league-nav-inner"><a href="index.html" class="">Home</a><a href="scores.html" class="">Scores</a><a href="schedule.html" class="active">Schedule</a><a href="standings.html" class="">Standings</a><a href="teams.html" class="">Teams</a><a href="transactions.html" class="">Transactions</a><a href="records.html" class="">Records</a><a href="league-history.html" class="">History</a><a href="draft-central.html" class="">Draft Central</a></div></nav><main class="league-shell"><noscript class="notice error">JavaScript is required for live Sleeper data. The CTE Network navigation will still work.</noscript>
<a class="back-link" href="schedule.html">← Back to Schedule</a><div id="content" class="league-card loading">Loading matchup center…</div>
<script>
const params=new URLSearchParams(location.search),season=Number(params.get('season')||CTE_LEAGUE_DATA.league.currentSeason),week=Number(params.get('week')||1),matchupId=String(params.get('matchup')||'');
function playerImg(id){return `https://sleepercdn.com/content/nfl/players/thumb/${encodeURIComponent(id)}.jpg`}
function lineup(ownerId,row,players){const ids=(row.starters||[]).filter(Boolean);return `<div class="lineup-card"><h3>${CTE_UI.ownerLink(ownerId,CTE_UI.owner(ownerId).name)} Starters</h3>${ids.length?ids.map(id=>{const p=players[id]||{},pts=Number(row.players_points?.[id]??row.starters_points?.[id]??0);return `<div class="lineup-player"><img src="${playerImg(id)}" onerror="this.style.visibility='hidden'" alt=""><div><strong>${CTE_UI.esc(p.full_name||p.first_name+' '+p.last_name||id)}</strong><span>${CTE_UI.esc(p.position||'')} • ${CTE_UI.esc(p.team||'FA')}</span></div><div class="lineup-points">${pts.toFixed(2)}</div></div>`}).join(''):'<div class="muted">Starting lineup not available yet.</div>'}</div>`}
async function historicalSeries(aid,bid){const games=[];for(const y of Object.keys(CTE_LEAGUE_DATA.league.seasons).map(Number).sort()){const cfg=CTE_LEAGUE_DATA.league.seasons[y],snap=await CTE_Sleeper.getLeagueSnapshot(cfg.sleeperLeagueId),lookup=CTE_UI.mapForSeason(y,snap.users,snap.rosters);for(let w=1;w<=18;w++){let rows;try{rows=await CTE_Sleeper.getMatchups(cfg.sleeperLeagueId,w)}catch(_){continue}for(const g of CTE_LeagueEngine.resolveGames(rows,lookup,y,w)){if((g.ownerA===aid&&g.ownerB===bid)||(g.ownerA===bid&&g.ownerB===aid))games.push(g)}}}return games}
(async()=>{const box=document.getElementById('content');try{const cfg=CTE_LEAGUE_DATA.league.seasons[season];if(!cfg)throw new Error('Season not found.');const [snap,rows,players]=await Promise.all([CTE_Sleeper.getLeagueSnapshot(cfg.sleeperLeagueId,{fresh:true}),CTE_Sleeper.getMatchups(cfg.sleeperLeagueId,week,{fresh:true}),CTE_Sleeper.getNFLPlayers()]);const lookup=CTE_UI.mapForSeason(season,snap.users,snap.rosters),pair=CTE_LeagueEngine.groupMatchups(rows).find(p=>p.length===2&&String(p[0].matchup_id)===matchupId);if(!pair)throw new Error('Matchup not found for this week.');const a=pair[0],b=pair[1],am=lookup[String(a.roster_id)],bm=lookup[String(b.roster_id)],aid=CTE_LeagueEngine.ownerForHistoricalWeek(am?.ownerId,season,week),bid=CTE_LeagueEngine.ownerForHistoricalWeek(bm?.ownerId,season,week),ao=CTE_UI.owner(aid),bo=CTE_UI.owner(bid),current=Number(snap.league?.settings?.leg||0),hasScore=Number(a.points||0)>0||Number(b.points||0)>0,status=season<CTE_LEAGUE_DATA.league.currentSeason||week<current||hasScore?'Final':week===current?'Current Week':'Upcoming';const series=await historicalSeries(aid,bid);let aw=0,bw=0,ties=0;series.forEach(g=>{if(g.winnerOwnerId===aid)aw++;else if(g.winnerOwnerId===bid)bw++;else ties++});box.className='';box.innerHTML=`<div class="matchup-hero"><div class="matchup-week">${season} • WEEK ${week} • ${status}</div><div class="matchup-versus"><div class="matchup-side"><div class="owner-name">${CTE_UI.ownerLink(aid,ao.name)}</div><div class="team-name">${CTE_UI.esc(am?.sleeperTeamName||ao.currentTeamName||'')}</div><div class="big-score">${status==='Upcoming'?'—':CTE_UI.fmt(a.points)}</div></div><div class="matchup-vs">VS</div><div class="matchup-side"><div class="owner-name">${CTE_UI.ownerLink(bid,bo.name)}</div><div class="team-name">${CTE_UI.esc(bm?.sleeperTeamName||bo.currentTeamName||'')}</div><div class="big-score">${status==='Upcoming'?'—':CTE_UI.fmt(b.points)}</div></div></div><div class="matchup-meta">All-time series: ${CTE_UI.esc(ao.name)} ${aw} • ${CTE_UI.esc(bo.name)} ${bw}${ties?' • '+ties+' tie(s)':''}</div></div><div class="lineup-columns">${lineup(aid,a,players)}${lineup(bid,b,players)}</div><div class="league-card series-card"><div class="section-head compact"><div><div class="eyebrow">RIVALRY HISTORY</div><h2>All-Time Meetings</h2></div></div><div class="series-list">${series.length?series.slice().sort((x,y)=>y.season-x.season||y.week-x.week).map(g=>{const left=g.ownerA===aid?g.scoreA:g.scoreB,right=g.ownerA===aid?g.scoreB:g.scoreA,w=g.winnerOwnerId?CTE_UI.owner(g.winnerOwnerId).name:'Tie';return `<div class="series-row"><span>${g.season} W${g.week}</span><span class="series-winner">${CTE_UI.esc(w)}</span><span class="series-score">${left.toFixed(2)} – ${right.toFixed(2)}</span></div>`}).join(''):'<div class="muted">No previous meetings recorded.</div>'}</div></div>`}catch(e){box.className='league-card';box.innerHTML=`<div class="notice error">${CTE_UI.esc(e.message)}</div>`}})();
</script></main><footer class="footer">CTE Network • Official Home of the CTE League • Powered by Sleeper</footer></body></html>
