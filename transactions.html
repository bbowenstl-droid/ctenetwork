<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c10"><title>Transactions • CTE League HQ</title><link rel="stylesheet" href="league.css"><script src="data/league-data.js?v=8"></script><script src="js/sleeper-api.js?v=8"></script><script src="js/league-engine.js?v=8"></script><script src="js/league-ui-v8.js?v=8"></script></head><body><script>CTE_UI.shellStart('transactions')</script>
<div class="section-head"><div><div class="eyebrow">Live from Sleeper</div><h2>Transactions</h2></div><div class="tx-toolbar"><select id="weekFilter" aria-label="Week"></select><select id="typeFilter" aria-label="Transaction type"><option value="all">All types</option><option value="trade">Trades</option><option value="waiver">Waivers</option><option value="free_agent">Free agents</option></select><span id="liveStamp" class="live-stamp">Updating…</span><button id="refreshLive" class="refresh-btn" type="button">↻ Refresh</button></div></div>
<div id="txSummary" class="tx-summary"></div><div id="content" class="league-card loading">Loading transactions…</div>
<script>
let snapshot=null,lookup=null,players=null,currentWeek=1,loaded=[];
const cfg=CTE_LEAGUE_DATA.league.seasons[2026];
function ownerForRoster(id){const m=lookup?.[String(id)];return CTE_UI.owner(m?.ownerId)}
function playerName(id){const p=players?.[String(id)];if(!p)return `Player ${id}`;return p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||p.search_full_name||`Player ${id}`}
function txDate(ms){if(!ms)return '';return new Date(Number(ms)).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function typeLabel(t){return t==='trade'?'Trade':t==='waiver'?'Waiver Claim':t==='free_agent'?'Free Agency':String(t||'Transaction').replaceAll('_',' ')}
function pickLabel(p){const original=ownerForRoster(p.roster_id)?.name||`Roster ${p.roster_id}`;return `${p.season} Round ${p.round} pick (${original})`}
function collectByRoster(tx){const rows={};const ensure=id=>rows[String(id)]||(rows[String(id)]={adds:[],drops:[],picksIn:[],picksOut:[],faabIn:0,faabOut:0});
 Object.entries(tx.adds||{}).forEach(([pid,rid])=>ensure(rid).adds.push(pid));Object.entries(tx.drops||{}).forEach(([pid,rid])=>ensure(rid).drops.push(pid));
 (tx.roster_ids||[]).forEach(ensure);
 (tx.draft_picks||[]).forEach(p=>{ensure(p.owner_id).picksIn.push(p);ensure(p.previous_owner_id).picksOut.push(p)});
 (tx.waiver_budget||[]).forEach(w=>{ensure(w.receiver).faabIn+=Number(w.amount||0);ensure(w.sender).faabOut+=Number(w.amount||0)});return rows}
function chip(cls,icon,text){return `<span class="tx-chip ${cls}">${icon} ${CTE_UI.esc(text)}</span>`}
function renderCard(tx){const rows=collectByRoster(tx);const teamHtml=Object.entries(rows).sort((a,b)=>Number(a[0])-Number(b[0])).map(([rid,m])=>{const o=ownerForRoster(rid);const moves=[];m.adds.forEach(pid=>moves.push(chip('add','＋',playerName(pid))));m.drops.forEach(pid=>moves.push(chip('drop','−',playerName(pid))));m.picksIn.forEach(p=>moves.push(chip('pick','⇢',`Received ${pickLabel(p)}`)));m.picksOut.forEach(p=>moves.push(chip('pick','⇠',`Sent ${pickLabel(p)}`)));if(m.faabIn)moves.push(chip('faab','＋',`$${m.faabIn} FAAB`));if(m.faabOut)moves.push(chip('faab','−',`$${m.faabOut} FAAB`));return `<div class="tx-team"><div class="tx-owner">${CTE_UI.esc(o?.name||`Roster ${rid}`)}</div><div class="tx-moves">${moves.length?moves.join(''):'<span class="tx-empty">Included in transaction</span>'}</div></div>`}).join('');
 return `<article class="tx-card ${CTE_UI.esc(tx.type||'') }" data-type="${CTE_UI.esc(tx.type||'')}"><div class="tx-head"><div><div class="tx-type">${CTE_UI.esc(typeLabel(tx.type))}</div><div class="team">${tx.status==='complete'?'Completed':CTE_UI.esc(tx.status||'')}</div></div><div class="tx-date">${CTE_UI.esc(txDate(tx.created))}</div></div>${teamHtml}</article>`}
function applyTypeFilter(){const val=document.getElementById('typeFilter').value;document.querySelectorAll('.tx-card').forEach(el=>el.classList.toggle('filter-hidden',val!=='all'&&el.dataset.type!==val));}
function summary(list){const c={trade:0,waiver:0,free_agent:0};list.forEach(x=>{if(c[x.type]!==undefined)c[x.type]++});document.getElementById('txSummary').innerHTML=`<span class="tx-count"><strong>${list.length}</strong> transactions</span><span class="tx-count"><strong>${c.trade}</strong> trades</span><span class="tx-count"><strong>${c.waiver}</strong> waivers</span><span class="tx-count"><strong>${c.free_agent}</strong> free-agent moves</span>`}
async function load(options={}){const content=document.getElementById('content'),btn=document.getElementById('refreshLive'),sel=document.getElementById('weekFilter');btn.disabled=true;content.classList.add('loading');content.textContent='Loading transactions…';try{
 if(!snapshot||options.fresh){snapshot=await CTE_Sleeper.getLeagueSnapshot(cfg.sleeperLeagueId,options);lookup=CTE_UI.mapForSeason(2026,snapshot.users,snapshot.rosters)}
 if(!players)players=await CTE_Sleeper.getNFLPlayers();
 const val=sel.value;let weeks=[];if(val==='all'){for(let w=1;w<=Math.max(currentWeek,1);w++)weeks.push(w)}else weeks=[Number(val)];
 const results=await Promise.all(weeks.map(w=>CTE_Sleeper.getTransactions(cfg.sleeperLeagueId,w,options).then(x=>(x||[]).map(t=>({...t,_week:w})))));loaded=results.flat().filter(t=>!t.status||t.status==='complete').sort((a,b)=>Number(b.created||0)-Number(a.created||0));
 content.classList.remove('loading');summary(loaded);content.className='tx-list';content.innerHTML=loaded.length?loaded.map(renderCard).join(''):'<div class="league-card"><div class="notice">No completed transactions found for this selection yet.</div></div>';applyTypeFilter();CTE_UI.setLiveStamp();
 }catch(e){content.className='league-card';content.innerHTML=`<div class="notice error">Could not load transactions. ${CTE_UI.esc(e.message)}</div>`}finally{btn.disabled=false}}
(async()=>{const sel=document.getElementById('weekFilter');try{const league=await CTE_Sleeper.getLeague(cfg.sleeperLeagueId,{fresh:true});currentWeek=Math.max(1,Number(league.settings?.leg||1))}catch(_){currentWeek=1}sel.add(new Option('Current week',String(currentWeek)));sel.add(new Option('All season','all'));for(let w=currentWeek;w>=1;w--)sel.add(new Option('Week '+w,String(w)));sel.value=String(currentWeek);sel.onchange=()=>load();document.getElementById('typeFilter').onchange=applyTypeFilter;document.getElementById('refreshLive').onclick=()=>{CTE_Sleeper.clearCache();snapshot=null;load({fresh:true})};await load({fresh:true})})();
</script><script>CTE_UI.shellEnd()</script></body></html>
