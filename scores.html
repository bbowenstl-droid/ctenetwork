<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scores • CTE League HQ</title><link rel="stylesheet" href="league.css"><script src="data/league-data.js?v=6"></script><script src="js/sleeper-api.js?v=6"></script><script src="js/league-engine.js?v=6"></script><script src="js/league-ui.js?v=6"></script></head><body><script>CTE_UI.shellStart('scores')</script>
<div class="section-head"><div><div class="eyebrow">2026 Season</div><h2>Weekly Scores</h2></div><div class="live-controls"><select id="week" style="width:auto;min-width:120px;background:#090c10;color:white;border:1px solid #414b57;border-radius:9px;padding:9px"></select><span id="liveStamp" class="live-stamp">Updating…</span><button id="refreshLive" class="refresh-btn" type="button">↻ Refresh</button></div></div><div id="content" class="league-card loading">Loading matchups…</div>
<script>
let snap,lookup;async function render(w,options={}){const c=document.getElementById('content'),btn=document.getElementById('refreshLive');btn.disabled=true;c.classList.add('loading');c.textContent='Loading Week '+w+'…';try{const cfg=CTE_LEAGUE_DATA.league.seasons[2026];if(!snap||options.fresh){snap=await CTE_Sleeper.getLeagueSnapshot(cfg.sleeperLeagueId,options);lookup=CTE_UI.mapForSeason(2026,snap.users,snap.rosters)}const m=await CTE_Sleeper.getMatchups(cfg.sleeperLeagueId,w,options);const groups=CTE_LeagueEngine.groupMatchups(m);c.classList.remove('loading');if(!groups.length){c.innerHTML='<div class="notice">No matchup data posted for this week yet.</div>';CTE_UI.setLiveStamp();return}c.innerHTML=groups.map(pair=>{if(pair.length!==2)return'';const a=pair[0],b=pair[1],am=lookup[String(a.roster_id)],bm=lookup[String(b.roster_id)],ao=CTE_UI.owner(am?.ownerId),bo=CTE_UI.owner(bm?.ownerId);return `<div class="matchup"><div><div class="owner">${CTE_UI.esc(ao.name)}</div><div class="team">${CTE_UI.esc(am?.sleeperTeamName||ao.currentTeamName||'')}</div><div class="score">${CTE_UI.fmt(a.points)}</div></div><div class="vs">VS</div><div class="right"><div class="owner">${CTE_UI.esc(bo.name)}</div><div class="team">${CTE_UI.esc(bm?.sleeperTeamName||bo.currentTeamName||'')}</div><div class="score">${CTE_UI.fmt(b.points)}</div></div></div>`}).join('');CTE_UI.setLiveStamp()}catch(e){c.classList.remove('loading');c.innerHTML=`<div class="notice error">${CTE_UI.esc(e.message)}</div>`}finally{btn.disabled=false}}
(async()=>{const sel=document.getElementById('week');for(let i=1;i<=18;i++)sel.add(new Option('Week '+i,i));try{const cfg=CTE_LEAGUE_DATA.league.seasons[2026];const league=await CTE_Sleeper.getLeague(cfg.sleeperLeagueId,{fresh:true});sel.value=Math.max(1,Number(league.settings?.leg||1));}catch(_){sel.value=1}sel.onchange=()=>render(Number(sel.value));document.getElementById('refreshLive').onclick=()=>{CTE_Sleeper.clearCache();snap=null;render(Number(sel.value),{fresh:true})};render(Number(sel.value));setInterval(()=>{CTE_Sleeper.clearCache();snap=null;render(Number(sel.value),{fresh:true})},60000);})();
</script><script>CTE_UI.shellEnd()</script></body></html>
