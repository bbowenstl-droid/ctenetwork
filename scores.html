<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scores • CTE Network</title><link rel="stylesheet" href="league-v15.css?v=15"><script src="data/league-data.js?v=15"></script><script src="sleeper-api-v16.js?v=16"></script><script src="js/league-engine.js?v=15"></script><script src="cte-network-core-v15.js?v=15"></script></head><body><div class="league-shell"><header class="league-header"><img src="cte-league-logo.png" alt="CTE League logo"><div><div class="league-kicker">OFFICIAL HOME OF THE CTE LEAGUE</div><h1 class="league-title">CTE NETWORK</h1><div class="muted">Year 2 • Established 2025</div></div></header></div><nav class="league-nav"><div class="league-nav-inner"><a href="index.html" class="">Home</a><a href="news.html" class="">News</a><a href="scores.html" class="active">Scores</a><a href="schedule.html" class="">Schedule</a><a href="standings.html" class="">Standings</a><a href="teams.html" class="">Teams</a><a href="transactions.html" class="">Transactions</a><a href="records.html" class="">Records</a><a href="league-history.html" class="">History</a><a href="draft-central.html" class="">Draft Central</a></div></nav><main class="league-shell"><noscript class="notice error">JavaScript is required for live Sleeper data. The CTE Network navigation will still work.</noscript>
<div class="section-head"><div><div class="eyebrow">2026 Season</div><h2>Weekly Scores</h2></div><div class="live-controls"><select id="week" style="width:auto;min-width:120px;background:#090c10;color:white;border:1px solid #414b57;border-radius:9px;padding:9px"></select><span id="liveStamp" class="live-stamp">Updating…</span><button id="refreshLive" class="refresh-btn" type="button">↻ Refresh</button><a class="btn" href="schedule.html">Full schedule →</a></div></div><div id="content" class="league-card loading">Loading matchups…</div>
<script>
let snap,lookup;async function render(w,options={}){const c=document.getElementById('content'),btn=document.getElementById('refreshLive');btn.disabled=true;c.classList.add('loading');c.textContent='Loading Week '+w+'…';try{const cfg=CTE_LEAGUE_DATA.league.seasons[2026];if(!snap||options.fresh){snap=await CTE_Sleeper.getLeagueSnapshot(cfg.sleeperLeagueId,options);lookup=CTE_UI.mapForSeason(2026,snap.users,snap.rosters)}const m=await CTE_Sleeper.getMatchups(cfg.sleeperLeagueId,w,options);const groups=CTE_LeagueEngine.groupMatchups(m);c.classList.remove('loading');if(!groups.length){c.innerHTML='<div class="notice">No matchup data posted for this week yet.</div>';CTE_UI.setLiveStamp();return}c.innerHTML=groups.map(pair=>{if(pair.length!==2)return'';const a=pair[0],b=pair[1],am=lookup[String(a.roster_id)],bm=lookup[String(b.roster_id)],ao=CTE_UI.owner(am?.ownerId),bo=CTE_UI.owner(bm?.ownerId);return `<div class="matchup"><div><a class="profile-cell-link" href="${CTE_UI.profileHref(am?.ownerId)}"><div class="owner">${CTE_UI.esc(ao.name)}</div><div class="team">${CTE_UI.esc(am?.sleeperTeamName||ao.currentTeamName||'')}</div></a><div class="score">${CTE_UI.fmt(a.points)}</div></div><div class="vs">VS</div><div class="right"><a class="profile-cell-link" href="${CTE_UI.profileHref(bm?.ownerId)}"><div class="owner">${CTE_UI.esc(bo.name)}</div><div class="team">${CTE_UI.esc(bm?.sleeperTeamName||bo.currentTeamName||'')}</div></a><div class="score">${CTE_UI.fmt(b.points)}</div></div></div>`}).join('');CTE_UI.setLiveStamp()}catch(e){c.classList.remove('loading');c.innerHTML=`<div class="notice error">${CTE_UI.esc(e.message)}</div>`}finally{btn.disabled=false}}
(async()=>{const sel=document.getElementById('week');for(let i=1;i<=18;i++)sel.add(new Option('Week '+i,i));try{const cfg=CTE_LEAGUE_DATA.league.seasons[2026];const league=await CTE_Sleeper.getLeague(cfg.sleeperLeagueId,{fresh:true});sel.value=Math.max(1,Number(league.settings?.leg||1));}catch(_){sel.value=1}sel.onchange=()=>render(Number(sel.value));document.getElementById('refreshLive').onclick=()=>{CTE_Sleeper.clearCache();snap=null;render(Number(sel.value),{fresh:true})};render(Number(sel.value));setInterval(()=>{CTE_Sleeper.clearCache();snap=null;render(Number(sel.value),{fresh:true})},60000);})();
</script></main><footer class="footer">CTE Network • Official Home of the CTE League • Powered by Sleeper</footer></body></html>
