<script>const id=new URLSearchParams(location.search).get('id');const a=CTE_NEWS.find(x=>x.id===id);const el=document.getElementById('article');if(a){document.title=a.title+' • CTE Network';const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});el.innerHTML=`<header class="article-header"><span class="news-badge">${a.kicker}</span><h1>${a.title}</h1><p class="article-subtitle">${a.subtitle}</p><div class="news-meta">${fmt(a.date)} • ${a.category}</div></header><div class="article-body">${a.body}</div>`}else{document.title='Article Not Found • CTE Network';el.innerHTML='<div class="notice error"><strong>Article not found.</strong> Refresh the page or return to CTE Network News.</div>'}</script>
