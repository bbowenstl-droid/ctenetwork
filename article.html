    <main class="league-shell"><article id="article" class="article-shell"></article><div class="article-back"><a class="btn" href="news.html">← Back to CTE Network News</a></div></main>
    <script>
      const id = new URLSearchParams(location.search).get("id");
      const a = (window.CTE_NEWS || []).find((x) => x.id === id);
      const el = document.getElementById("article");
      if (a) {
        document.title = a.title + " • CTE Network";
        const fmt = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-US", {month:"long",day:"numeric",year:"numeric"});
        el.innerHTML = `<header class="article-header"><span class="news-badge">${a.kicker}</span><h1>${a.title}</h1><p class="article-subtitle">${a.subtitle}</p><div class="news-meta">${fmt(a.date)} • ${a.category}</div>${a.author==="Concussion Carl"?'<div style="margin-top:12px"><a class="btn" href="carl.html">Meet Concussion Carl →</a></div>':''}</header><div class="article-body">${a.body}</div>`;
        const norm=(t)=>String(t).toLowerCase().replace(/[^a-z0-9]/g,'');
        el.querySelectorAll('.article-body [class*="-article-hero"] h2').forEach((h)=>{if(norm(h.textContent)&&norm(a.title).includes(norm(h.textContent)))h.remove()});
        if (window.CTE_BookEmbeds) try { CTE_BookEmbeds.hydrate(el); } catch (e) { console.warn('Sportsbook embeds unavailable', e); }
      } else {
        document.title = "Article Not Found • CTE Network";
        el.innerHTML = '<div class="notice error"><strong>Article not found.</strong> Refresh the page or return to CTE Network News.</div>';
      }
    </script>
