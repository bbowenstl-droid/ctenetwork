<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standings • CTE League HQ</title><link rel="stylesheet" href="league-v11.css?v=11"><script src="data/league-data.js?v=11"></script><script src="js/sleeper-api.js?v=11"></script><script src="js/league-engine.js?v=11"></script><script src="js/league-ui-v11.js?v=11"></script></head><body><script>CTE_UI.shellStart('standings')</script>
<div class="section-head"><div><div class="eyebrow">2026 Season</div><h2>Standings</h2></div><div><span id="status" class="status-pill">Connecting…</span><div style="margin-top:7px"><div class="live-controls"><span id="liveStamp" class="live-stamp">Updating…</span><button id="refreshLive" class="refresh-btn" type="button" title="Pull fresh data from Sleeper">↻ Refresh</button></div></div></div></div><div id="content" class="league-card loading">Loading current rosters and records…</div>
<script>
async function loadStandings(options={}){const c=document.getElementById('content'),st=document.getElementById('status'),btn=document.getElementById('refreshLive');btn.disabled=true;c.classList.add('loading');try{const cfg=CTE_LEAGUE_DATA.league.seasons[2026],snap=await CTE_Sleeper.getLeagueSnapshot(cfg.sleeperLeagueId,options),lookup=CTE_UI.mapForSeason(2026,snap.users,snap.rosters),rows=CTE_UI.standingsRows(snap.rosters,lookup);const divisions=['north','south','central','littleBabies'];c.classList.remove('loading');c.innerHTML=divisions.map(d=>{const list=rows.filter(r=>r.division===d);return `<div style="margin-bottom:22px"><div class="division-title">${CTE_UI.divisionName(d)}</div><div class="table-wrap"><table class="league-table"><thead><tr><th>Owner</th><th>W</th><th>L</th><th>PF</th><th>PA</th></tr></thead><tbody>${list.map(r=>`<tr><td><a class="profile-cell-link" href="${CTE_UI.profileHref(r.ownerId)}"><div class="owner">${CTE_UI.esc(r.name)}</div><div class="team">${CTE_UI.esc(r.team)}</div></a></td><td>${r.wins}</td><td>${r.losses}</td><td>${CTE_UI.fmt(r.pf)}</td><td>${CTE_UI.fmt(r.pa)}</td></tr>`).join('')}</tbody></table></div></div>`}).join('');st.textContent='Live from Sleeper';st.classList.add('live');CTE_UI.setLiveStamp()}catch(e){c.classList.remove('loading');c.innerHTML=`<div class="notice error">${CTE_UI.esc(e.message)}</div>`;st.textContent='Connection failed'}finally{btn.disabled=false}}
document.getElementById('refreshLive').onclick=()=>{CTE_Sleeper.clearCache();loadStandings({fresh:true})};loadStandings({fresh:true});
</script><script>CTE_UI.shellEnd()</script></body></html>
