<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c10"><title>Rivalry • CTE Network</title><link rel="stylesheet" href="league-v15.css?v=15"><link rel="stylesheet" href="rivalries-v21.css?v=21"><link rel="stylesheet" href="mobile-app-v22.css?v=22"><link rel="stylesheet" href="design-v23.css?v=23"><link rel="stylesheet" href="features-v24.css?v=24"><script src="data/league-data.js?v=21"></script><script src="sleeper-api-v16.js?v=16"></script><script src="js/league-engine.js?v=21"></script><script src="js/stats-engine.js?v=24"></script><script src="cte-network-core-v15.js?v=24"></script><link rel="apple-touch-icon" href="apple-touch-icon.png?v=22"><link rel="manifest" href="manifest.webmanifest?v=22"></head><body>
<div class="league-shell"><header class="league-header"><img src="cte-league-logo.png" alt="CTE League logo"><div><div class="league-kicker">OFFICIAL HOME OF THE CTE LEAGUE</div><h1 class="league-title">CTE NETWORK</h1><div class="muted">Year 2 • Established 2025</div></div></header></div><nav class="league-nav"><div class="league-nav-inner"><a href="index.html">Home</a><a href="game-day.html">Game Day</a><a href="changes.html">Changes</a><a href="news.html">News</a><a href="scores.html">Scores</a><a href="schedule.html">Schedule</a><a href="rivalries.html" class="active">Rivalries</a><a href="standings.html">Standings</a><a href="teams.html">Teams</a><a href="transactions.html">Transactions</a><a href="records.html">Records</a><a href="league-history.html">History</a><a href="draft-central.html">Draft Central</a></div></nav><main class="league-shell"><a class="back-link" href="rivalries.html">← All rivalries</a><div id="rivalryDetail" class="league-card loading">Building rivalry history…</div></main><footer class="footer">CTE Network • Rivalries • Powered by Sleeper</footer>
<script>
const rivalryDefs={duncan:{name:'Duncan Dynasty Bowl',sponsor:"Dunkin'",a:'jacob',b:'carter',tag:'The family name is guaranteed to win. Everything else is up for grabs.',trophy:'The Duncan Cup',lore:'Father vs. son. Same bloodline, same last name, and one full year of being able to tell the other who actually runs the Duncan household.'},father:{name:'Father Knows Best Bowl',sponsor:"Not Your Father's Root Beer",a:'brendan',b:'isaiah',tag:'He taught him everything he knows. Allegedly.',trophy:'#1 Dad Mug',lore:'A father-son matchup where the postgame headline writes itself. Brendan wins: Father Knows Best. Isaiah wins: Father Did Not Know Best.'},favorite:{name:'The Favorite Child Classic',sponsor:'Tecovas',a:'jesse',b:'troy',tag:'Mom says she loves them equally. The standings say otherwise.',trophy:"The Golden Boot — MOM'S FAVORITE",lore:'Brothers settle the question their mother refuses to answer. The winner becomes the Official Favorite Child until the next annual meeting.'},social:{name:'The Social Security Bowl',sponsor:'Life Alert',a:'jerry',b:'elijah',tag:'Retirement benefits vs. homework.',trophy:'The Golden Walker',lore:'Grandpa vs. grandson. Decades of fantasy experience against the youngest generation. Respect Your Elders meets Elder Abuse.'},friends:{name:'The F Is for Friends Bowl',sponsor:'SpongeBob SquarePants',a:'mike',b:'dan',tag:'F is for friends who do stuff together… until they do not.',trophy:'The Golden Friendship Bracelet',lore:'Once inseparable, then came The Fallout. Relations returned, but true friendship is now measured through fantasy football.'},weekend:{name:'The Weekend League Classic',sponsor:'Sherwin-Williams',a:'brett',b:'cotton',tag:'Cover the Earth. Sweat the Match.',trophy:'The Golden Paint Can + 99 OVR Card',lore:'Built from years of FIFA Ultimate Team, Weekend League misery and Brett’s paint-world connection.'}};
const rid=new URLSearchParams(location.search).get('id')||'duncan',def=rivalryDefs[rid],box=document.getElementById('rivalryDetail');
async function rivalrySchedule(def){const cfg=CTE_LEAGUE_DATA.league.seasons[2026],snap=await CTE_Sleeper.getLeagueSnapshot(cfg.sleeperLeagueId),lookup=CTE_UI.mapForSeason(2026,snap.users,snap.rosters),weeks=await Promise.all(Array.from({length:18},(_,i)=>CTE_Sleeper.getMatchups(cfg.sleeperLeagueId,i+1).catch(()=>[]).then(rows=>({week:i+1,rows}))));const hits=[];for(const w of weeks)for(const p of CTE_LeagueEngine.groupMatchups(w.rows).filter(x=>x.length===2)){const a=lookup[String(p[0].roster_id)]?.ownerId,b=lookup[String(p[1].roster_id)]?.ownerId;if((a===def.a&&b===def.b)||(a===def.b&&b===def.a))hits.push(w.week)}return hits}
(async()=>{try{if(!def)throw new Error('Rivalry not found.');document.title=`${def.name} • CTE Network`;const [archives,weeks]=await Promise.all([CTE_StatsEngine.loadAllSeasons({fresh:true}),rivalrySchedule(def)]),result=CTE_StatsEngine.calculateOwnerStats(archives),games=result.games.filter(g=>(g.ownerA===def.a&&g.ownerB===def.b)||(g.ownerA===def.b&&g.ownerB===def.a)).sort((x,y)=>y.season-x.season||y.week-x.week),h=CTE_StatsEngine.headToHead(result.games)[`${def.a}|${def.b}`]||{wins:0,losses:0,ties:0,games:0,pf:0,pa:0},oa=CTE_UI.owner(def.a),ob=CTE_UI.owner(def.b),leader=h.wins>h.losses?oa.name:h.losses>h.wins?ob.name:'Tied',sa=result.owners[def.a],sb=result.owners[def.b],official=weeks.length>=2?`Week ${weeks[1]}`:weeks.length===1?'Second meeting TBD':'Schedule TBD';box.className='';box.innerHTML=`<section class="feature-hero rivalry-detail-hero"><div class="eyebrow">PRESENTED BY ${CTE_UI.esc(def.sponsor).toUpperCase()}</div><h2>${CTE_UI.esc(def.name)}</h2><p>“${CTE_UI.esc(def.tag)}”</p><div class="rivalry-versus"><div class="rivalry-owner"><strong>${CTE_UI.ownerLink(def.a,oa.name)}</strong><span>${CTE_UI.esc(oa.currentTeamName)}</span></div><div class="rivalry-vs">VS</div><div class="rivalry-owner"><strong>${CTE_UI.ownerLink(def.b,ob.name)}</strong><span>${CTE_UI.esc(ob.currentTeamName)}</span></div></div></section><div class="rivalry-metrics"><div class="profile-stat"><span>Series</span><strong>${h.wins}-${h.losses}${h.ties?'-'+h.ties:''}</strong></div><div class="profile-stat"><span>Leader</span><strong>${CTE_UI.esc(leader)}</strong></div><div class="profile-stat"><span>Meetings</span><strong>${h.games}</strong></div><div class="profile-stat"><span>2026 Trophy Game</span><strong>${official}</strong></div></div><div class="feature-dashboard"><section class="league-card"><div class="eyebrow">THE STORY</div><h2>${CTE_UI.esc(def.trophy)}</h2><p class="muted">${CTE_UI.esc(def.lore)}</p><div class="notice rival-note">The second regular-season meeting each year is the official trophy game beginning in 2026.</div></section><section class="league-card"><div class="eyebrow">CAREER SNAPSHOT</div><h2>By the numbers</h2><div class="season-leader-row"><span>${CTE_UI.esc(oa.name)} career record</span><strong>${sa.wins}-${sa.losses}</strong></div><div class="season-leader-row"><span>${CTE_UI.esc(ob.name)} career record</span><strong>${sb.wins}-${sb.losses}</strong></div><div class="season-leader-row"><span>Series points</span><strong>${CTE_UI.fmt(h.pf)}–${CTE_UI.fmt(h.pa)}</strong></div></section></div><div class="feature-section-head"><div><div class="eyebrow">EVERY MEETING</div><h2>Head-to-head timeline</h2></div></div><div class="rivalry-timeline">${games.length?games.map(g=>{const a=CTE_UI.owner(g.ownerA),b=CTE_UI.owner(g.ownerB),winner=g.winnerOwnerId?CTE_UI.owner(g.winnerOwnerId).name:'Tie';return `<div class="rivalry-meeting"><span>${g.season} • W${g.week}</span><div><strong class="winner">${CTE_UI.esc(winner)}</strong><div class="muted">${CTE_UI.esc(a.name)} vs. ${CTE_UI.esc(b.name)}</div></div><span class="rivalry-score">${CTE_UI.fmt(g.scoreA)}–${CTE_UI.fmt(g.scoreB)}</span></div>`}).join(''):'<div class="league-card notice">No completed meetings recorded yet.</div>'}</div>`}catch(e){box.className='league-card';box.innerHTML=`<div class="notice error">${CTE_UI.esc(e.message)}</div>`}})();
</script><script src="app-shell-v22.js?v=24"></script><script src="design-v23.js?v=24"></script></body></html>
