<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c10">
<title>CTE Draft Central — Hall of Champions</title>
<link rel="stylesheet" href="common.css">
<style>
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-weight:800;font-size:13px;letter-spacing:.04em;padding:6px 2px;border-radius:6px}
.back:hover,.back:focus-visible{color:var(--gold2)}
.back:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.masthead{text-align:center;padding:36px 20px 30px}
.masthead .trophy{font-size:46px;line-height:1;margin-bottom:6px}
.masthead h1{margin:0;font-size:clamp(28px,5vw,46px);letter-spacing:.08em;color:var(--silver)}
.masthead .sub{color:var(--gold2);letter-spacing:.16em;font-size:13px;margin-top:8px;text-transform:uppercase}

.champion-card{margin-top:26px;padding:0;overflow:hidden}
.champion-head{background:linear-gradient(135deg,#241c0c,#0d1116 65%);padding:22px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.champion-head .season{font-size:13px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.champion-head .season b{color:var(--gold2);display:block;font-size:22px;letter-spacing:.04em;margin-top:2px}
.champion-head .trophy-badge{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);background:#0b0e13;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}

.matchup{padding:26px;display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}
.side{text-align:center;padding:16px 10px;border-radius:10px}
.side .role{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.side .name{font-size:26px;font-weight:900;letter-spacing:.02em}
.side.win{background:linear-gradient(180deg,#26200f,#11161d);border:1px solid var(--gold)}
.side.win .name{color:var(--gold2)}
.side.win .role{color:var(--gold)}
.side.lose .name{color:var(--silver)}
.vs{font-weight:900;color:var(--muted);font-size:14px;letter-spacing:.1em}

.note{padding:0 26px 26px;color:var(--muted);font-size:14px;line-height:1.6}
.note b{color:#fff}

@media(max-width:600px){
  .wrap{padding:10px 10px 35px}.masthead{padding:24px 8px 18px}
  .champion-card{margin-top:14px}.champion-head{padding:17px}
  .matchup{grid-template-columns:1fr;gap:10px;padding:16px}
  .vs{padding:2px 0}.side .name{font-size:23px}.note{padding:0 16px 18px}
}
@media(prefers-reduced-motion:no-preference){
  .champion-card{animation:rise .5s ease both}
}
@media(prefers-reduced-motion:reduce){
  .champion-card{animation:none}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head><body>
<nav class="site-nav" aria-label="Primary">
  <div class="site-nav-inner">
    <a class="nav-link NAV_HOME" href="index.html"><span class="nav-icon">🏠</span><span>Home</span></a>
    <a class="nav-link NAV_COUNTDOWN" href="countdown.html"><span class="nav-icon">⏳</span><span>Countdown</span></a>
    <a class="nav-link NAV_BOARD" href="tv.html"><span class="nav-icon">📺</span><span>Draft Board</span></a>
    <a class="nav-link NAV_ADMIN" href="admin.html"><span class="nav-icon">🎙️</span><span>Commissioner</span></a>
    <a class="nav-link NAV_HISTORY active" href="history.html"><span class="nav-icon">🏆</span><span>Champions</span></a>
  </div>
</nav>

<div class="shell wrap">
  <div class="masthead">
    <div class="trophy">🏆</div>
    <h1>HALL OF CHAMPIONS</h1>
    <div class="sub">CTE League Championship History</div>
  </div>

  <section class="panel champion-card" aria-labelledby="champ-2025-26">
    <div class="champion-head">
      <div class="season">Season<b id="champ-2025-26">2025–26</b></div>
      <div class="trophy-badge">🏆</div>
    </div>
    <div class="matchup">
      <div class="side win">
        <div class="role">Champion</div>
        <div class="name">Brendan</div>
      </div>
      <div class="vs">DEF.</div>
      <div class="side lose">
        <div class="role">Runner-Up</div>
        <div class="name">Jacob</div>
      </div>
    </div>
    <div class="note">Brendan won the <b>2025–26</b> championship, defeating Jacob in the title match to become the league's inaugural recorded champion.</div>
  </section>
</div>
</body></html>
